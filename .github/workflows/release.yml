name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag name (e.g. v1.0.1-pre)"
        required: true
        default: "v1.0.1-pre"
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: true

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build Nexus plugin
        run: |
          cmake -S plugins/nexus -B plugins/nexus/build -A x64
          cmake --build plugins/nexus/build --config Release

      - name: Package builds
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/cba4gw2-nexus-plugin | Out-Null
          Copy-Item plugins/nexus/build/bin/Release/cba.dll artifacts/cba4gw2-nexus-plugin/
          Copy-Item README.md artifacts/cba4gw2-nexus-plugin/
          Copy-Item SECURITY_COMPLIANCE.md artifacts/cba4gw2-nexus-plugin/
          Copy-Item plugins/nexus/README.md artifacts/cba4gw2-nexus-plugin/
          Compress-Archive -Path artifacts/cba4gw2-nexus-plugin/* -DestinationPath artifacts/cba4gw2-nexus-plugin-win-x64.zip
          Copy-Item plugins/nexus/build/bin/Release/cba.dll artifacts/cba.dll

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || contains(github.ref_name, '-') }}
          files: |
            artifacts/cba4gw2-nexus-plugin-win-x64.zip
            artifacts/cba.dll
          generate_release_notes: true
