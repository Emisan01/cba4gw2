name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Restore dependencies
        run: dotnet restore ColorblindAssist.csproj

      - name: Build
        run: dotnet build ColorblindAssist.csproj --configuration Release --no-restore

      - name: Publish portable build
        run: dotnet publish ColorblindAssist.csproj --configuration Release --runtime win-x64 --self-contained true --output artifacts/ColorblindAssist-win-x64

      - name: Publish slim build
        run: dotnet publish ColorblindAssist.csproj --configuration Release --runtime win-x64 --self-contained false --property:PublishSingleFile=true --output artifacts/ColorblindAssist-slim-win-x64

      - name: Package builds
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/ColorblindAssist-win-x64/* -DestinationPath artifacts/ColorblindAssist-win-x64.zip
          Compress-Archive -Path artifacts/ColorblindAssist-slim-win-x64/* -DestinationPath artifacts/ColorblindAssist-slim-win-x64.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ColorblindAssist-builds
          path: artifacts/*.zip
