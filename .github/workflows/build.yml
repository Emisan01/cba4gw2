name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build Nexus plugin
        run: |
          cmake -S plugins/nexus -B plugins/nexus/build -A x64
          cmake --build plugins/nexus/build --config Release

      - name: Package build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item plugins/nexus/build/bin/Release/cba.dll artifacts/
          Copy-Item README.md artifacts/
          Compress-Archive -Path artifacts/* -DestinationPath artifacts/cba4gw2-nexus-plugin.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cba4gw2-nexus-plugin
          path: artifacts/cba4gw2-nexus-plugin.zip
